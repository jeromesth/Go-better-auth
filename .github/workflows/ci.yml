name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          go build ./...
          cd testutil && go build ./...

      - name: Unit Tests
        run: go test ./...

      - name: E2E Tests
        run: cd e2e && go test ./...

      - name: Testutil Module Build
        run: cd testutil && go build ./...

      - name: Examples Module Build
        run: cd examples/backend && go build ./...

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage summary
        run: go tool cover -func=coverage.out | grep total

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Integration Tests
        env:
          TEST_POSTGRES_DSN: postgres://test:test@localhost:5432/testdb?sslmode=disable
        run: go test -tags=integration ./adapter/sqlx/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: |
          go vet ./...
          cd e2e && go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l . e2e/)" ]; then
            echo "Code is not formatted. Run 'gofmt -w . e2e/'"
            gofmt -d . e2e/
            exit 1
          fi

