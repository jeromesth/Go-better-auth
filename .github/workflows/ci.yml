name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          cd packages/betterauth && go build ./...
          cd ../../packages/testutil && go build ./...

      - name: Unit Tests
        run: cd packages/betterauth && go test ./...

      - name: E2E Tests
        run: cd e2e && go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: |
          cd packages/betterauth && go vet ./...
          cd ../../e2e && go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l packages/ e2e/)" ]; then
            echo "Code is not formatted. Run 'gofmt -w packages/ e2e/'"
            gofmt -d packages/ e2e/
            exit 1
          fi
